server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A 1,100-page manual is a single large multipart POST. nginx's 1 MB
    # default rejects it with a 413 before the backend is ever reached, which
    # surfaces in the interface as an upload that failed for no stated reason.
    client_max_body_size 4g;

    location /api/ {
        # No URI part after the port, so the original path is passed through
        # unchanged: /api/health stays /api/health.
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/chat streams tokens as they are generated. Buffered, nginx holds
        # the whole answer until the model finishes and the screen sits empty
        # for thirty seconds — the one thing the streaming design exists to
        # avoid.
        proxy_buffering off;
        proxy_cache off;

        # An ingest runs for tens of minutes behind one request, and an answer
        # on a cold model can take a couple of minutes. The 60s default cuts
        # both off mid-flight.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The pdf.js worker ships as .mjs, and nginx's bundled mime.types has no
    # mapping for that extension — it went out as application/octet-stream.
    # Browsers enforce strict MIME checking on ES modules and refuse to execute
    # one served under any other type, so the worker never loaded:
    #
    #   Setting up fake worker failed: "Failed to fetch dynamically imported
    #   module: .../assets/pdf.worker-*.mjs"
    #
    # pdf.js then falls back to running the worker on the main thread, which
    # imports the same rejected module and fails identically — so a document
    # does not open at all.
    #
    # A regex location outranks the /assets/ prefix below, so this must repeat
    # the caching headers rather than inherit them. The empty types block drops
    # the inherited map for this location only, leaving default_type to answer
    # for every .mjs regardless of what a future mime.types may add.
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static assets are content-hashed by Vite, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached: it names the hashed bundles, and a stale
    # copy points at files that no longer exist after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
