# NVIDIA GPU for Ollama. Layer over the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# Requires the NVIDIA Container Toolkit on the host. Check it first — this
# override silently does nothing useful without it:
#
#   docker run --rm --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04 nvidia-smi
#
# The 4B at Q4_K_M with a 16k context is ~3.7 GB, the embedder ~0.7 GB. Both
# resident needs ~4.4 GB of VRAM; see README-DEPLOY.md.

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
