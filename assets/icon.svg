<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="field" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#1A5490"/>
      <stop offset="0.5" stop-color="#0B2C4C"/>
      <stop offset="1" stop-color="#04121F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#35C6E0" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#35C6E0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="field-clip">
      <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#field)"/>

  <g clip-path="url(#field-clip)" fill="none" stroke-linecap="round">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#glow)"/>

    <!-- Drawing paper -->
    <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
      <line x1="64" y1="0" x2="64" y2="1024"/>
      <line x1="0" y1="64" x2="1024" y2="64"/>
      <line x1="128" y1="0" x2="128" y2="1024"/>
      <line x1="0" y1="128" x2="1024" y2="128"/>
      <line x1="192" y1="0" x2="192" y2="1024"/>
      <line x1="0" y1="192" x2="1024" y2="192"/>
      <line x1="256" y1="0" x2="256" y2="1024"/>
      <line x1="0" y1="256" x2="1024" y2="256"/>
      <line x1="320" y1="0" x2="320" y2="1024"/>
      <line x1="0" y1="320" x2="1024" y2="320"/>
      <line x1="384" y1="0" x2="384" y2="1024"/>
      <line x1="0" y1="384" x2="1024" y2="384"/>
      <line x1="448" y1="0" x2="448" y2="1024"/>
      <line x1="0" y1="448" x2="1024" y2="448"/>
      <line x1="512" y1="0" x2="512" y2="1024"/>
      <line x1="0" y1="512" x2="1024" y2="512"/>
      <line x1="576" y1="0" x2="576" y2="1024"/>
      <line x1="0" y1="576" x2="1024" y2="576"/>
      <line x1="640" y1="0" x2="640" y2="1024"/>
      <line x1="0" y1="640" x2="1024" y2="640"/>
      <line x1="704" y1="0" x2="704" y2="1024"/>
      <line x1="0" y1="704" x2="1024" y2="704"/>
      <line x1="768" y1="0" x2="768" y2="1024"/>
      <line x1="0" y1="768" x2="1024" y2="768"/>
      <line x1="832" y1="0" x2="832" y2="1024"/>
      <line x1="0" y1="832" x2="1024" y2="832"/>
      <line x1="896" y1="0" x2="896" y2="1024"/>
      <line x1="0" y1="896" x2="1024" y2="896"/>
      <line x1="960" y1="0" x2="960" y2="1024"/>
      <line x1="0" y1="960" x2="1024" y2="960"/>
    </g>

    <!-- Bearing ring -->
    <circle cx="512.0" cy="512.0" r="330" stroke="#35C6E0" stroke-opacity="0.5" stroke-width="13"/>
    <circle cx="512.0" cy="512.0" r="268" stroke="#35C6E0" stroke-opacity="0.22" stroke-width="9"/>

    <g stroke="#35C6E0" stroke-opacity="0.75" stroke-width="15">
      <line x1="512.0" y1="162.0" x2="512.0" y2="250.0"/>
      <line x1="512.0" y1="774.0" x2="512.0" y2="862.0"/>
      <line x1="162.0" y1="512.0" x2="250.0" y2="512.0"/>
      <line x1="774.0" y1="512.0" x2="862.0" y2="512.0"/>
    </g>

    <!-- Centreline, struck through the keel -->
    <line x1="512.0" y1="333" x2="512.0" y2="691"
          stroke="#35C6E0" stroke-opacity="0.45" stroke-width="9"
          stroke-dasharray="26 18"/>

    <!-- The sections themselves -->
    <g stroke="#8FD9EA" stroke-width="21" stroke-linejoin="round">
      <path d="M 512 661 C 609 661, 654 616, 654 482 L 654 378" />
      <path d="M 512 661 C 579 653, 601 601, 601 505 L 601 378" />
      <path d="M 512 661 C 534 631, 549 572, 549 512 L 549 378" />
    </g>
  </g>
</svg>
